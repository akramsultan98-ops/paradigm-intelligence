[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paradigm-intelligence"
version = "1.0.0"
description = "Corporate event opportunity intelligence engine for PARADIGM (Egypt)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "feedparser>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.7"]

[project.scripts]
paradigm = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# B008: FastAPI's Depends()/Query() defaults are the framework's idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# C408: test fixtures build kwargs-style defaults with dict(...) and then override
# them; a quoted literal would be noisier, not clearer.
"tests/*" = ["C408"]
