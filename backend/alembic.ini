[alembic]
# %(here)s is the directory holding this file, so alembic works from any working
# directory - `alembic -c backend/alembic.ini upgrade head` from the repo root,
# or `alembic upgrade head` from inside backend/.
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
